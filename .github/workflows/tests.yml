name: Test native desktop and shared boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q compcontrol
